<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#04060b">
<title>Distro</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%234f7cff'/%3E%3Cpath d='M10 8h6a8 8 0 0 1 0 16h-6z' fill='%2304060b'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/style.css">
</head>
<body>

<section id="auth" hidden>
  <form id="auth-form" class="card" autocomplete="on">
    <div class="brand">
      <svg viewBox="0 0 32 32" width="44" height="44" aria-hidden="true"><rect width="32" height="32" rx="9" fill="currentColor"/><path d="M10 8h6a8 8 0 0 1 0 16h-6z" fill="#04060b"/></svg>
      <h1>Distro</h1>
      <p id="auth-sub">Content de te revoir.</p>
    </div>
    <label>Pseudo<input id="auth-user" name="username" required minlength="2" maxlength="24" autocomplete="username"></label>
    <label>Mot de passe<input id="auth-pass" name="password" type="password" required minlength="8" maxlength="128" autocomplete="current-password"></label>
    <p id="auth-err" class="err" role="alert"></p>
    <button class="btn primary" id="auth-submit" type="submit">Se connecter</button>
    <p class="switch"><span id="auth-switch-label">Pas encore de compte ?</span> <a href="#" id="auth-switch">Créer un compte</a></p>
  </form>
</section>

<div id="app" hidden>
  <nav id="rail" aria-label="Serveurs"></nav>
  <aside id="side">
    <header id="side-head"></header>
    <div id="side-list"></div>
    <div id="voice-dock" hidden></div>
    <footer id="me-bar"></footer>
  </aside>
  <main id="chat">
    <header id="chat-head"></header>
    <div id="msgs" tabindex="0"></div>
    <div id="typing" aria-live="polite"></div>
    <div id="reply-bar" hidden></div>
    <form id="composer" hidden>
      <div id="attach-bar" hidden aria-label="Fichiers à envoyer"></div>
      <button type="button" class="icon-btn" id="attach-btn" title="Joindre un fichier (image, MP3, ZIP…)" aria-label="Joindre un fichier">📎</button>
      <input type="file" id="file-input" multiple hidden>
      <button type="button" class="icon-btn" id="emoji-btn" title="Émojis" aria-label="Émojis">☺</button>
      <textarea id="input" rows="1" maxlength="4000" placeholder="Écrire un message" aria-label="Message"></textarea>
      <button class="btn primary send" type="submit" aria-label="Envoyer">Envoyer</button>
    </form>
    <div id="drop" hidden><div>📎 Dépose tes fichiers ici pour les joindre</div></div>
  </main>
  <aside id="members" aria-label="Membres"></aside>
</div>

<div id="pop" hidden></div>
<div id="modal-root"></div>
<div id="toasts" aria-live="polite"></div>
<script src="/app.js"></script>
<script src="/voice.js"></script>
</body>
</html>
