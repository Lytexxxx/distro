name: Sauvegarde Supabase Distro

on:
  workflow_dispatch:
  schedule:
    - cron: "30 3 * * *"

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Vérifier les secrets
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          test -n "$DATABASE_URL" || (echo "Secret SUPABASE_DATABASE_URL manquant" && exit 1)
          test -n "$SUPABASE_URL" || (echo "Secret SUPABASE_URL manquant" && exit 1)
          test -n "$SUPABASE_SERVICE_ROLE_KEY" || (echo "Secret SUPABASE_SERVICE_ROLE_KEY manquant" && exit 1)

      - name: Exporter PostgreSQL
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
        run: |
          mkdir -p backups
          docker run --rm \
            -e DATABASE_URL \
            -v "$PWD/backups:/backups" \
            postgres:17-alpine \
            sh -c 'pg_dump "$DATABASE_URL" --no-owner --no-acl --format=custom --file=/backups/distro.dump'
          test -s backups/distro.dump

      - name: Exporter Supabase Storage
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_STORAGE_BUCKET: distro-files
        run: python3 .github/scripts/backup_storage.py

      - name: Publier la sauvegarde complète
        uses: actions/upload-artifact@v4
        with:
          name: distro-complete-backup-${{ github.run_id }}
          path: backups/
          if-no-files-found: error
          retention-days: 90
