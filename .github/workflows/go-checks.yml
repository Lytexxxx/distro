name: Go checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [supabase-persistence]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true
      - run: go mod tidy
      - run: go test ./...
      - run: go build ./...
