name: Test de restauration Supabase Distro

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: distro-restore-test
  cancel-in-progress: false

jobs:
  restore-test:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Vérifier les secrets
        env:
          SOURCE_DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
          SOURCE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SOURCE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          STAGING_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          STAGING_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          STAGING_SERVICE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          test -n "$SOURCE_DATABASE_URL" || (echo "Secret SUPABASE_DATABASE_URL manquant" && exit 1)
          test -n "$SOURCE_SUPABASE_URL" || (echo "Secret SUPABASE_URL manquant" && exit 1)
          test -n "$SOURCE_SERVICE_KEY" || (echo "Secret SUPABASE_SERVICE_ROLE_KEY manquant" && exit 1)
          test -n "$STAGING_DATABASE_URL" || (echo "Secret STAGING_DATABASE_URL manquant" && exit 1)
          test -n "$STAGING_SUPABASE_URL" || (echo "Secret STAGING_SUPABASE_URL manquant" && exit 1)
          test -n "$STAGING_SERVICE_KEY" || (echo "Secret STAGING_SUPABASE_SERVICE_ROLE_KEY manquant" && exit 1)

      - name: Exporter la table Distro de production
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
        run: |
          mkdir -p backups
          docker run --rm \
            -e DATABASE_URL \
            -v "$PWD/backups:/backups" \
            postgres:17-alpine \
            sh -c 'pg_dump "$DATABASE_URL" --no-owner --no-acl --format=custom --table=public.distro_persistence --file=/backups/distro.dump'
          test -s backups/distro.dump

      - name: Exporter les fichiers de production
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_STORAGE_BUCKET: distro-files
        run: python3 .github/scripts/backup_storage.py

      - name: Restaurer la base dans le projet de test
        env:
          STAGING_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
        run: |
          docker run --rm \
            -e STAGING_DATABASE_URL \
            -v "$PWD/backups:/backups" \
            postgres:17-alpine \
            sh -c 'pg_restore --exit-on-error --no-owner --no-acl --dbname="$STAGING_DATABASE_URL" /backups/distro.dump'

      - name: Vérifier la base restaurée
        env:
          STAGING_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
        run: |
          count=$(docker run --rm -e STAGING_DATABASE_URL postgres:17-alpine \
            sh -c 'psql "$STAGING_DATABASE_URL" -v ON_ERROR_STOP=1 -Atc "SELECT count(*) FROM public.distro_persistence WHERE id = 1"')
          test "$count" = "1" || (echo "Échec : la ligne de persistance Distro est absente (résultat: $count)" && exit 1)
          echo "OK : la ligne de persistance Distro est présente dans la base de test."

      - name: Restaurer les fichiers dans le bucket de test
        env:
          SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_STORAGE_BUCKET: distro-files
        run: python3 .github/scripts/restore_storage.py

      - name: Résultat
        run: |
          echo "SUCCÈS : la base PostgreSQL et les fichiers Storage ont été restaurés dans l’environnement de test. La production n’a pas été modifiée."
